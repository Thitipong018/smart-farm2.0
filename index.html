  /* ตัวเลขในกล่อง (ตำแหน่งตรงกับกรอบสีเขียวในพื้นหลัง) */
  .value {
    position: absolute;
    top: 385px; height: 271px; width: 271px;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 55px;
    font-family: "Mansalva", "Permanent Marker", cursive;
    font-size: 150px; line-height: 1.1;
    color: #000;
    user-select: none;
    transition: transform .25s;
  }
  .value.pop { transform: scale(1.08); }

  /* ปุ่ม toggle */
  .toggle {
    position: absolute;
    top: 670px; height: 81px; width: 272px;
    border: 0; border-radius: 41px;
    background: #c8d0da;
    cursor: pointer; z-index: 3;
    transition: background .25s;
    outline: none;
  }
  .toggle::after {
    content: ""; position: absolute; left: 0; top: 0;
    width: 82px; height: 82px; border-radius: 50%;
    border: 3px solid #000;
    background: linear-gradient(90deg, #8f8f8f 0%, #d8d8d8 50%, #ffffff 100%);
    transition: transform .25s ease;
  }
  .toggle.on { background: #7ea03f; }
  .toggle.on::after { transform: translateX(190px); }
  .toggle:focus-visible { box-shadow: 0 0 0 4px rgba(0,128,140,.5); }

  svg.deco { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #lizard { z-index: 2; }
  #bat { z-index: 4; }
</style>
</head>

<script>
  /* ย่อ/ขยายเวทีให้เต็มจอ โดยยังคงตำแหน่งเค้าโครงเดิม */
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.max(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
    stage.style.left = '50%'; stage.style.top = '50%';
  }
  addEventListener('resize', fit); fit();

  /* ช่วงค่าสุ่มของแต่ละเซนเซอร์: [min, max] */
  const ranges = [[20, 40], [30, 95], [0, 999], [0, 100]];
  const rand = ([a, b]) => Math.floor(Math.random() * (b - a + 1)) + a;

  function setValue(i) {
    const el = document.getElementById('v' + i);
    el.textContent = rand(ranges[i]);
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 250);
  }

  const timers = [null, null, null, null];

  for (let i = 0; i < 4; i++) {
    setValue(i);                       // สุ่มค่าตอนโหลดหน้า
    const t = document.getElementById('t' + i);
    t.addEventListener('click', () => {
      const on = t.classList.toggle('on');
      t.setAttribute('aria-pressed', on);
      if (on) {                        // เปิด = สุ่มค่าอัปเดตต่อเนื่องทุก 2 วินาที
        setValue(i);
        timers[i] = setInterval(() => setValue(i), 2000);
      } else {                         // ปิด = หยุดค่าไว้
        clearInterval(timers[i]);
      }
    });
  }
</script>
